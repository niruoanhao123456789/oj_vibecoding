<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - OJ Vibecoding</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-body">
  <div class="auth-cloud auth-cloud-1" aria-hidden="true"></div>
  <div class="auth-cloud auth-cloud-2" aria-hidden="true"></div>
  <nav id="main-nav"></nav>
  <div class="auth-page">
    <div class="auth-head">
      <div class="auth-logo" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5" />
        </svg>
      </div>
      <h1 class="auth-title">创建账号</h1>
      <p class="auth-sub">种下代码的种子，静候思想的发芽</p>
    </div>
    <div class="card auth-card">
      <div id="alert" class="alert"></div>
      <form id="register-form">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" autocomplete="username"
                 placeholder="3-64 位字母、数字或下划线" required>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" autocomplete="new-password"
                 placeholder="至少 6 位" required>
        </div>
        <div class="form-group">
          <label for="confirm">确认密码</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password"
                 placeholder="再次输入密码" required>
        </div>
        <div class="form-group">
          <label for="teacher-code">教师邀请码（可选）</label>
          <input type="text" id="teacher-code" name="teacher-code"
                 placeholder="填写正确邀请码可注册为教师，留空则注册为学生" maxlength="255">
        </div>
        <button type="submit" id="submit-btn" class="btn btn-block">注 册</button>
      </form>
      <div class="auth-footer">
        已有账号？<a href="/pages/login.html">直接登录</a>
      </div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
