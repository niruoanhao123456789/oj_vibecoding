<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - OJ Vibecoding</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="main-nav"></nav>
  <div class="auth-page">
    <div class="card auth-card">
      <h1>注册</h1>
      <div id="alert" class="alert"></div>
      <form id="register-form">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" autocomplete="username"
                 placeholder="3-64 位字母、数字或下划线" required>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" autocomplete="new-password"
                 placeholder="至少 6 位" required>
        </div>
        <div class="form-group">
          <label for="confirm">确认密码</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password"
                 placeholder="再次输入密码" required>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-block">注册</button>
      </form>
      <div class="auth-footer">
        已有账号？<a href="/pages/login.html">直接登录</a>
      </div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
